name: Free Credential Issuer UI - Q5
on:
  push:
    branches: [certzaky-public-probe-20261123]
    paths: ['.github/workflows/issuer-ui-check.yml']
permissions:
  contents: read
jobs:
  quiz-screen:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: View final cybersecurity quiz question
        run: |
          set -euo pipefail
          mkdir -p /tmp/issuer-browser && cd /tmp/issuer-browser
          npm init -y --silent >/dev/null
          npm install --no-save --silent playwright-core@1.56.1
          cat > inspect.cjs <<'JS'
          const {chromium}=require('playwright-core');
          (async()=>{
            const b=await chromium.launch({executablePath:'/usr/bin/google-chrome',headless:true,args:['--no-sandbox']});
            const p=await b.newPage();
            try{
              await p.goto('https://academy.cyberarmy.ai/quiz/ai-security',{waitUntil:'domcontentloaded',timeout:25000});
              await p.getByRole('button',{name:/Start quiz/i}).click();
              await p.getByRole('button',{name:/Crafting inputs that override a model/i}).click();
              await p.getByRole('button',{name:'Next'}).click();
              await p.getByRole('button',{name:/Corrupting the training data to manipulate/i}).click();
              await p.getByRole('button',{name:'Next'}).click();
              await p.getByRole('button',{name:/Extracting sensitive training data from a trained model/i}).click();
              await p.getByRole('button',{name:'Next'}).click();
              await p.getByRole('button',{name:/Small, often imperceptible changes/i}).click();
              await p.getByRole('button',{name:'Next'}).click();
              await p.waitForTimeout(350);
              console.log('QUESTION_FIVE '+JSON.stringify(await p.evaluate(()=>({
                body:document.body.innerText.slice(0,1600),
                buttons:[...document.querySelectorAll('button')].filter(x=>x.getClientRects().length).map(x=>({text:x.innerText.trim().slice(0,220),disabled:x.disabled})).slice(-14)
              }))));
            }finally{await b.close();}
          })().catch(e=>{console.error('Q5_ERROR '+e.stack);process.exitCode=1});
          JS
          node inspect.cjs
