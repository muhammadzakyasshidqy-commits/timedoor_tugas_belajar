name: Science of Apps - Assessment UI Grounding
on:
  push:
    branches: [certzaky-public-probe-20261123]
    paths: ['.github/workflows/issuer-ui-check.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect two free server-scored certification interfaces; read only
        run: |
          set -euo pipefail
          npm install --no-save --silent playwright-core@1.56.1
          cat > /tmp/inspect-soa.cjs <<'JS'
          const {chromium}=require(process.cwd()+'/node_modules/playwright-core');
          (async()=>{
            const browser=await chromium.launch({executablePath:'/usr/bin/google-chrome',headless:true,args:['--no-sandbox']});
            for(const url of ['https://scienceofapps.com/certification/cybersecurity-fundamentals/','https://scienceofapps.com/certification/ai-workflow-automation/']){
              const p=await browser.newPage();
              try{
                const res=await p.goto(url,{waitUntil:'domcontentloaded',timeout:25000});
                await p.waitForTimeout(700);
                const state=()=>p.evaluate(()=>({
                  url:location.href,title:document.title,text:document.body.innerText.slice(0,2600),
                  buttons:[...document.querySelectorAll('button')].filter(x=>x.getClientRects().length>0).map(x=>({text:x.innerText.slice(0,150),type:x.type})).slice(0,28),
                  inputs:[...document.querySelectorAll('input')].filter(x=>x.getClientRects().length>0).map(x=>({type:x.type,name:x.name,placeholder:x.placeholder})).slice(0,22)
                }));
                console.log('SOA_LANDING '+JSON.stringify({http:res.status(),...(await state())}));
                const start=p.getByRole('button',{name:/Start the .* test/i}).first();
                if(await start.count()){
                  await start.click({timeout:12000});
                  await p.waitForTimeout(600);
                  console.log('SOA_STARTED '+JSON.stringify(await state()));
                }
              }catch(e){console.log('SOA_ERROR '+JSON.stringify({url,error:String(e.message)}));}
              await p.close();
            }
            await browser.close();
          })().catch(e=>{console.error('SYSTEM_ERROR '+e.stack);process.exitCode=1});
          JS
          node /tmp/inspect-soa.cjs
