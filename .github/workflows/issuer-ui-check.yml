name: Cyber Army - Archive Original PDF
on:
  push:
    branches: [certzaky-public-probe-20261123]
    paths: ['.github/workflows/issuer-ui-check.yml']
permissions:
  contents: write
jobs:
  download-issued:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Download existing issuer-issued PDF and verify binary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p issuer-credentials
          FILE='issuer-credentials/Cyber_Army_AI_Security_cert-62a2673541b0.pdf'
          curl --fail --location --silent --show-error --retry 2 --max-time 30 -H 'Accept: application/pdf' 'https://academy.cyberarmy.ai/api/certificate/cert-62a2673541b0/pdf' --output "$FILE"
          MAGIC="$(head -c 5 "$FILE")"
          SIZE="$(wc -c < "$FILE")"
          if [ "$MAGIC" != '%PDF-' ] || [ "$SIZE" -lt 1000 ] || [ "$SIZE" -gt 3000000 ]; then echo 'Invalid original issuer PDF'; exit 1; fi
          echo "ISSUER_PDF_VERIFIED size=$SIZE sha256=$(sha256sum "$FILE" | cut -d' ' -f1)"
          if command -v pdftotext >/dev/null; then
            pdftotext "$FILE" - | head -40 | sed 's/[[:cntrl:]]/ /g'
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "$FILE"
          if ! git diff --cached --quiet; then
            git commit -m 'Archive issuer original AI Security quiz achievement certificate'
            git push origin HEAD:certzaky-public-probe-20261123
          fi
