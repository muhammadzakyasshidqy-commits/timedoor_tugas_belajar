name: Web Application Security - Final Question
on:
  push:
    branches: [certzaky-public-probe-20261123]
    paths: ['.github/workflows/issuer-ui-check.yml']
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Review final question after four normal quiz selections
        run: |
          set -euo pipefail
          mkdir -p /tmp/issuer-browser && cd /tmp/issuer-browser
          npm init -y --silent >/dev/null
          npm install --no-save --silent playwright-core@1.56.1
          cat > preview.cjs <<'JS'
          const {chromium}=require('playwright-core');
          (async()=>{
            const browser=await chromium.launch({executablePath:'/usr/bin/google-chrome',headless:true,args:['--no-sandbox']});
            const page=await browser.newPage();
            try {
              await page.goto('https://academy.cyberarmy.ai/quiz/web-application-security',{waitUntil:'domcontentloaded',timeout:25000});
              await page.getByRole('button',{name:/Start quiz/i}).click();
              await page.getByRole('button',{name:/Execute scripts in user browser/i}).click();
              await page.getByRole('button',{name:'Next'}).click();
              await page.waitForTimeout(450);
              await page.getByRole('button',{name:/Direct object access without authorization/i}).click();
              await page.getByRole('button',{name:'Next'}).click();
              await page.waitForTimeout(450);
              await page.getByRole('button',{name:/Improper input validation/i}).click();
              await page.getByRole('button',{name:'Next'}).click();
              await page.waitForTimeout(450);
              await page.getByRole('button',{name:/User's authenticated session/i}).click();
              await page.getByRole('button',{name:'Next'}).click();
              await page.waitForTimeout(450);
              console.log('FINAL_WEBAPP_QUESTION '+JSON.stringify(await page.evaluate(()=>({
                  text:document.body.innerText.slice(0,1600),
                  buttons:[...document.querySelectorAll('button')].filter(x=>x.getClientRects().length&&/^[A-D]\n/.test(x.innerText)).map(x=>x.innerText.trim())
              }))));
            } finally {await browser.close();}
          })().catch(e=>{console.error('FINAL_WEBAPP_ERROR '+e.stack);process.exitCode=1;});
          JS
          node preview.cjs
