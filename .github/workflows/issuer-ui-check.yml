name: Cyber Army - Five Topics Full Question Evidence
on:
  push:
    branches: [certzaky-public-probe-20261123]
    paths: ['.github/workflows/issuer-ui-check.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Collect visible 5-question texts from normal browser flow, no certificate submission
        run: |
          set -euo pipefail
          npm install --no-save --silent playwright-core@1.56.1
          cat > /tmp/q.cjs <<'JS'
          const {chromium}=require(process.cwd()+'/node_modules/playwright-core');
          (async()=>{
            const browser=await chromium.launch({executablePath:'/usr/bin/google-chrome',headless:true,args:['--no-sandbox']});
            for(const slug of ['cloud-security','incident-response','zero-trust-security','data-privacy','network-security']){
              const page=await browser.newPage();
              const qs=[];
              try{
                await page.goto('https://academy.cyberarmy.ai/quiz/'+slug,{waitUntil:'domcontentloaded',timeout:24000});
                await page.getByRole('button',{name:/Start quiz/i}).click();
                for(let i=1;i<=5;i++){
                  await page.waitForFunction(n=>document.body.innerText.includes('Question '+n+' of 5')&&document.body.innerText.includes(String.fromCharCode(10)+n+'.'),i,{timeout:9000});
                  const d=await page.evaluate(()=>({
                    question:document.body.innerText.split('Question ')[1]?.split('Previous')[0]?.slice(0,640),
                    options:[...document.querySelectorAll('button')].filter(b=>b.getClientRects().length&&/^[A-D]\n/.test(b.innerText)).map(b=>b.innerText.trim())
                  }));
                  if(d.options.length!==4)throw Error('Missing options at '+i);
                  qs.push({n:i,...d});
                  if(i<5){await page.getByRole('button',{name:/^A\s/}).first().click();await page.getByRole('button',{name:'Next'}).click();}
                }
                console.log('FULL_QUIZ '+JSON.stringify({slug,questions:qs}));
              }catch(e){console.log('FULL_QUIZ_ERROR '+JSON.stringify({slug,error:String(e),partial:qs}));}
              await page.close();
            }
            await browser.close();
          })().catch(e=>{console.error('FULL_FATAL '+e.stack);process.exitCode=1;});
          JS
          node /tmp/q.cjs
