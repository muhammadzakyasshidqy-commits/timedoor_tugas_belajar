name: Science of Apps - Cybersecurity Questions Review
on:
  push:
    branches: [certzaky-public-probe-20261123]
    paths: ['.github/workflows/issuer-ui-check.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read public quiz questions without submitting a result
        run: |
          set -euo pipefail
          npm install --no-save --silent playwright-core@1.56.1
          cat > /tmp/inspect-soa.cjs <<'JS'
          const {chromium}=require(process.cwd()+'/node_modules/playwright-core');
          (async()=>{
            const browser=await chromium.launch({executablePath:'/usr/bin/google-chrome',headless:true,args:['--no-sandbox']});
            const page=await browser.newPage();
            try{
              await page.goto('https://scienceofapps.com/certification/cybersecurity-fundamentals/',{waitUntil:'domcontentloaded',timeout:25000});
              await page.getByRole('button',{name:/Start the 10-minute test/i}).first().click();
              const questions=[];
              for(let i=1;i<=10;i++){
                const state=await page.evaluate(()=>({
                  text:document.body.innerText.slice(0,950),
                  radios:[...document.querySelectorAll('input[type=radio]')].filter(x=>x.getClientRects().length).map(x=>({value:x.value,label:x.closest('label')?.innerText||x.parentElement?.innerText||''}))
                }));
                questions.push({q:i,...state});
                if(i<10){
                  await page.locator('input[type=radio]:visible').first().check();
                  await page.getByRole('button',{name:/^Next/}).click();
                  await page.waitForTimeout(170);
                }
              }
              console.log('SOA_CYBER_QUESTIONS '+JSON.stringify(questions));
              console.log('NOT_SUBMITTED_AND_NO_CERTIFICATE_ISSUED');
            }finally{await browser.close();}
          })().catch(e=>{console.error('SOA_PREVIEW_ERROR '+e.stack);process.exitCode=1});
          JS
          node /tmp/inspect-soa.cjs
