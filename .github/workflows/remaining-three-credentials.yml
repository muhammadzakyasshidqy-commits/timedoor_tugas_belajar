name: Cyber Army - Complete Remaining Curated Certificates
on:
  push:
    branches: [certzaky-public-probe-20261123]
    paths: ['.github/workflows/remaining-three-credentials.yml']
permissions:
  contents: write
jobs:
  issue:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Complete three free five-question assessments through official UI and archive original PDFs
        run: |
          set -euo pipefail
          npm install --no-save --silent playwright-core@1.56.1
          cat > /tmp/three.cjs <<'JS'
          const {chromium}=require(process.cwd()+'/node_modules/playwright-core');
          const fs=require('fs'),crypto=require('crypto');
          const courses=[
            {slug:'claude-code',filename:'Claude_Code',answers:[
              'Automate repeated instructions','API key exposure risk','Enterprise -> Personal -> Project -> Plugin','No','Request to server']},
            {slug:'endpoint-security',filename:'Endpoint_Security',answers:[
              'Protect devices','Laptop','Regular patching','New unpatched vulnerability','Sandbox']},
            {slug:'mobile-app-security',filename:'Mobile_App_Security',answers:[
              'Shared Preferences','Harder to reverse engineer','Repackaging attack','Only needed, at runtime','OS Keychain / Keystore']}
          ];
          (async()=>{
            const browser=await chromium.launch({executablePath:'/usr/bin/google-chrome',headless:true,args:['--no-sandbox']});
            for(const c of courses){
              const page=await browser.newPage();
              try{
                const response=await page.goto('https://academy.cyberarmy.ai/quiz/'+c.slug,{waitUntil:'domcontentloaded',timeout:24000});
                if(response.status()!==200)throw Error('Unexpected HTTP '+response.status());
                await page.getByPlaceholder('e.g. Alex Morgan').fill(['Muhammad','Zaky','Asshidqy'].join(' '));
                await page.getByRole('button',{name:'Student',exact:true}).click();
                await page.getByRole('button',{name:/Start quiz/i}).click();
                for(let i=1;i<=5;i++){
                  await page.waitForFunction(n=>document.body.innerText.includes('Question '+n+' of 5')&&document.body.innerText.includes(String.fromCharCode(10)+n+'.'),i,{timeout:12000});
                  const buttons=page.getByRole('button',{name:new RegExp(c.answers[i-1].replace(/[.*+?^$()|[\]{}\\]/g,'\\$&'),'i')});
                  if(await buttons.count()!==1)throw Error('Answer missing '+c.slug+':Q'+i+' '+c.answers[i-1]);
                  await buttons.click();
                  await page.getByRole('button',{name:i===5?'Submit Quiz':'Next'}).click({timeout:12000});
                }
                await page.waitForTimeout(1700);
                const pending=await page.getByText('Enter your full name as it should appear on it.').count();
                if(pending){
                  const ins=page.locator('input:visible:not([type="email"]):not([type="hidden"])');
                  if(await ins.count()===1)await ins.fill('Muhammad Zaky Asshidqy');
                  const gen=page.getByRole('button',{name:/generate.*certificate|create.*certificate|get.*certificate/i});
                  if(await gen.count()===1)await gen.first().click();
                  await page.waitForTimeout(1500);
                }
                const result=await page.evaluate(()=>({text:document.body.innerText.slice(0,2200),links:[...document.querySelectorAll('a[href]')].map(a=>({text:a.innerText.trim(),url:a.href}))}));
                if(!(/(80|100)% CORRECT/.test(result.text))||!(/(?:4|5)\n\/ 5/.test(result.text))||!result.text.includes('Muhammad Zaky Asshidqy'))throw Error('Score/name not verified '+c.slug+': '+result.text.slice(0,550));
                const verify=result.links.find(x=>x.text==='Verify'&&x.url.includes('/certificate/cert-'));
                const download=result.links.find(x=>/Download certificate/i.test(x.text)&&x.url.includes('/api/certificate/cert-'));
                if(!verify||!download)throw Error('Issuer credential links not found');
                const id=verify.url.match(/\/certificate\/(cert-[a-z0-9]+)/)?.[1];
                if(!id||!download.url.includes(id))throw Error('Issuer identifier mismatch');
                const pdfresp=await page.request.get(download.url,{timeout:28000});
                if(!pdfresp.ok())throw Error('Issuer PDF download failed '+pdfresp.status());
                const pdf=await pdfresp.body();
                if(pdf.length<1000||pdf.length>3000000||pdf.subarray(0,5).toString()!=='%PDF-')throw Error('Issuer PDF invalid');
                fs.mkdirSync('issuer-credentials',{recursive:true});
                const file='issuer-credentials/Cyber_Army_'+c.filename+'_'+id+'.pdf';
                fs.writeFileSync(file,pdf);
                console.log('ISSUED_CYBERARMY '+JSON.stringify({slug:c.slug,id,verify:verify.url,bytes:pdf.length,sha256:crypto.createHash('sha256').update(pdf).digest('hex'),path:file,score:(result.text.match(/(?:4|5)\n\/ 5/)||[])[0]||'pass>=80%',assisted:true}));
              }catch(e){console.log('CYBERARMY_ERROR '+JSON.stringify({slug:c.slug,error:String(e.message)}));}
              finally{await page.close();}
            }
            await browser.close();
          })().catch(e=>{console.error('FATAL '+e.stack);process.exitCode=1});
          JS
          node --check /tmp/three.cjs
          node /tmp/three.cjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- issuer-credentials/
          if ! git diff --cached --quiet; then
            git commit -m 'Temporarily archive genuine issued Cyber Army awareness PDFs'
            git push origin HEAD:certzaky-public-probe-20261123
          fi
