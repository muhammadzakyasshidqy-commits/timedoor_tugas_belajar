name: Cyber Army - Network Security Recovery
on:
  push:
    branches: [certzaky-public-probe-20261123]
    paths: ['.github/workflows/network-repair.yml']
permissions:
  contents: write
jobs:
  issue:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Verify actual quiz completion and issue via normal UI
        run: |
          set -euo pipefail
          npm install --no-save --silent playwright-core@1.56.1
          cat > /tmp/quiz.cjs <<'JS'
          const {chromium}=require(process.cwd()+'/node_modules/playwright-core');
          const fs=require('fs'),crypto=require('crypto');
          (async()=>{
            const b=await chromium.launch({executablePath:'/usr/bin/google-chrome',headless:true,args:['--no-sandbox']});
            try{
              const p=await b.newPage(),name='Muhammad Zaky Asshidqy';
              const r=await p.goto('https://academy.cyberarmy.ai/quiz/network-security',{waitUntil:'domcontentloaded',timeout:25000});
              if(r.status()!==200)throw Error('HTTP '+r.status());
              const initial=p.getByPlaceholder('e.g. Alex Morgan');
              if(await initial.count())await initial.fill(name);
              const role=p.getByRole('button',{name:'Student',exact:true});
              if(await role.count())await role.click();
              await p.getByRole('button',{name:/Start quiz/i}).click();
              const answers=['Filter network traffic','Redirect users to fake sites','SSH','Router','53'];
              for(let n=1;n<=5;n++){
                await p.waitForFunction(n=>document.body.innerText.includes('Question '+n+' of 5'),n,{timeout:12000});
                const candidates=await p.getByRole('button').all();
                const targets=[];
                for(const el of candidates){
                  const t=(await el.innerText()).trim();
                  if(t.split('\n').slice(1).join(' ').toLowerCase().includes(answers[n-1].toLowerCase()))targets.push(el);
                }
                if(targets.length!==1)throw Error('No unique option '+n+' found');
                await targets[0].click();
                await p.getByRole('button',{name:n===5?'Submit Quiz':'Next'}).click();
              }
              await p.waitForTimeout(1400);
              let state=await p.evaluate(()=>({text:document.body.innerText.slice(0,2300),inputs:[...document.querySelectorAll('input')].filter(x=>x.offsetParent!==null).map(x=>({html:x.outerHTML.slice(0,250),value:x.value})),buttons:[...document.querySelectorAll('button')].filter(x=>x.offsetParent!==null).map(x=>x.innerText.trim()),links:[...document.querySelectorAll('a[href]')].map(x=>({label:x.innerText.trim(),url:x.href}))}));
              console.log('STATE_BEFORE '+JSON.stringify(state));
              if(!state.text.includes('100% CORRECT')||!state.text.includes('5\n/ 5'))throw Error('Quiz did not pass 5/5');
              const inputs=p.locator('input:visible:not([type="email"]):not([type="hidden"]):not([type="checkbox"])');
              if(await inputs.count()===1)await inputs.first().fill(name);
              else {
                const n=p.locator('input[placeholder*="name" i]:visible');
                if(await n.count()===1)await n.fill(name);
              }
              const generate=p.getByRole('button',{name:/generate.*certificate|create.*certificate|claim.*certificate|issue.*certificate|get.*certificate|download.*certificate|generate.*pdf/i});
              console.log('GENERATOR_BUTTON_COUNT',await generate.count());
              if(await generate.count()===1){await generate.first().click();await p.waitForTimeout(1800);}
              state=await p.evaluate(()=>({text:document.body.innerText.slice(0,2300),inputs:[...document.querySelectorAll('input')].filter(x=>x.offsetParent!==null).map(x=>({html:x.outerHTML.slice(0,250),value:x.value})),buttons:[...document.querySelectorAll('button')].filter(x=>x.offsetParent!==null).map(x=>x.innerText.trim()),links:[...document.querySelectorAll('a[href]')].map(x=>({label:x.innerText.trim(),url:x.href}))}));
              console.log('STATE_AFTER '+JSON.stringify(state));
              const verify=state.links.find(x=>x.url.startsWith('https://academy.cyberarmy.ai/certificate/cert-'));
              const download=state.links.find(x=>x.url.startsWith('https://academy.cyberarmy.ai/api/certificate/cert-'));
              if(!verify||!download)throw Error('No actual issuer credential link');
              const id=verify.url.match(/\/certificate\/(cert-[a-z0-9]+)/)?.[1];
              if(!id||!download.url.includes(id))throw Error('Issuer ID mismatch');
              const publicPage=await p.request.get(verify.url,{timeout:25000});
              if(!publicPage.ok()||!(await publicPage.text()).includes(name))throw Error('Issuer verification failed');
              const pdf=await p.request.get(download.url,{timeout:25000});
              if(!pdf.ok())throw Error('Issuer PDF HTTP '+pdf.status());
              const bytes=await pdf.body();
              if(bytes.length<1000||bytes.length>3000000||bytes.subarray(0,5).toString()!=='%PDF-')throw Error('Not an original PDF');
              fs.mkdirSync('issuer-credentials',{recursive:true});
              const path='issuer-credentials/Cyber_Army_Network_Security_'+id+'.pdf';
              fs.writeFileSync(path,bytes);
              console.log('ISSUED_CYBERARMY '+JSON.stringify({name,course:'Network Security',id,verify:verify.url,score:'5/5',assistant_assisted:true,bytes:bytes.length,sha256:crypto.createHash('sha256').update(bytes).digest('hex'),path}));
            }finally{await b.close();}
          })().catch(e=>{console.error('ACTUAL_ERROR '+e.stack);process.exitCode=1});
          JS
          node --check /tmp/quiz.cjs
          node /tmp/quiz.cjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- issuer-credentials/Cyber_Army_Network_Security_*.pdf
          if ! git diff --cached --quiet; then
            git commit -m 'Store issuer Network Security certificate pending private Drive archival'
            git push origin HEAD:certzaky-public-probe-20261123
          fi
